# 数据集与初始权重。
dataset: data/myconfigs/testdata.yaml
weights: yolov5s.pt

# 训练配置。
train:
  imgsz: 320
  batch_size: -1  # -1：根据 GPU 显存自动选择。
  epochs: 1
  device: "0"  # "0"：第一块 GPU；"cpu"：使用 CPU。
  workers: 2
  cache: null
  project: runs/train
  name: maixcam_test
  exist_ok: true

# MaixCam ONNX 接口配置。
export:
  width: 256
  height: 160
  opset: 12
  output_names: [out0, out1, out2]
  project: runs/export
  name: maixcam_test

# Docker 输入配置。
docker:
  directory: D:/docker_data/models
  model_name: null  # null：使用导出权重文件名。
  sample_count: 10
  calibration_count: 200
  source: null  # null：读取 dataset.train。
